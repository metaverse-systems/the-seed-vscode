name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repeat:
        description: "Run the host suite this many times in a row (reliability check)"
        default: "1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  THE_SEED_VERSION: "2.1.0" # the tool, from the public registry
  LIBECS_CPP_REF: 16a272ce17bf03369febf0796444a8df8cd1ffec # libecs-cpp 2.1.0
  LIBTHE_SEED_REF: 839bc62d3233e88347059942ce25e84da23b48ee # libthe-seed 0.8.0
  VSCODE_VERSION: "1.143.0" # must equal .vscode-test.mjs; checked below
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "Tag $REF_NAME matches package.json version $version"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb build-essential autoconf automake libtool pkg-config python3 openssl osslsigncode g++-mingw-w64-x86-64 wixl libxml2-utils
          # The POSIX threads flavour of the cross compiler, which libthe-seed needs.
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          node --version
          npm --version
          xvfb-run --help > /dev/null
          pkg-config --version
          python3 --version
          openssl version
          osslsigncode --version
          x86_64-w64-mingw32-g++ --version
          wixl --version

      - name: Restore libraries
        id: deps
        uses: actions/cache@v6
        with:
          path: ~/deps
          key: deps-linux-windows-${{ env.LIBECS_CPP_REF }}-${{ env.LIBTHE_SEED_REF }}-${{ runner.os }}-${{ env.ImageVersion }}

      - name: Build libecs-cpp
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/libecs-cpp"
          cd "$RUNNER_TEMP/libecs-cpp"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libecs-cpp.git "$LIBECS_CPP_REF"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --prefix="$HOME/deps" --enable-tests=no
          make -j4
          make install

      - name: Build libthe-seed
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH="$HOME/deps/lib/pkgconfig"
          mkdir -p "$RUNNER_TEMP/libthe-seed"
          cd "$RUNNER_TEMP/libthe-seed"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libthe-seed.git "$LIBTHE_SEED_REF"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --prefix="$HOME/deps" --enable-tests=no
          make -j4
          make install

      # The Windows libraries are cross-built into <deps>/x86_64-w64-mingw32, the
      # place the tool looks in for a Windows build under a prefix, searching
      # only there and in the toolchain's own directories.
      - name: Build libecs-cpp for Windows
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$HOME/deps/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          mkdir -p "$RUNNER_TEMP/libecs-cpp-windows"
          cd "$RUNNER_TEMP/libecs-cpp-windows"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libecs-cpp.git "$LIBECS_CPP_REF"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix="$HOME/deps/x86_64-w64-mingw32" --enable-tests=no
          make -j4
          make install

      - name: Build libthe-seed for Windows
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$HOME/deps/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          mkdir -p "$RUNNER_TEMP/libthe-seed-windows"
          cd "$RUNNER_TEMP/libthe-seed-windows"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libthe-seed.git "$LIBTHE_SEED_REF"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix="$HOME/deps/x86_64-w64-mingw32" --enable-tests=no
          make -j4
          make install

      - name: Use libraries
        run: |
          echo "PKG_CONFIG_PATH=$HOME/deps/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/lib" >> "$GITHUB_ENV"
          echo "THE_SEED_TEST_DEPS=$HOME/deps" >> "$GITHUB_ENV"

      - name: Check the Windows toolchain and libraries
        run: |
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-g++ -v 2>&1 | grep 'Thread model: posix'
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$HOME/deps/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          pkg-config --modversion ecs-cpp the-seed
          ls "$HOME/deps/x86_64-w64-mingw32/bin"

      - name: Install the tool
        run: npm install -g "@metaverse-systems/the-seed@$THE_SEED_VERSION" --foreground-scripts

      - name: Check the tool
        run: |
          node - "$(npm root -g)/@metaverse-systems/the-seed" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const root = process.argv[2];
          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          const installed = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8')).version;
          const expected = process.env.THE_SEED_VERSION;
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = manifest.devDependencies && manifest.devDependencies['@metaverse-systems/the-seed'];
          if (installed !== expected) {
            fail(`the tool is ${installed}, expected ${expected}`);
          }
          if (declared !== expected) {
            fail(`package.json declares the tool as ${declared}, expected ${expected}`);
          }
          const component = path.join(root, 'native', 'build', 'Release', 'the_seed_native.node');
          const { REQUIRED_VERSIONS } = require(path.join(root, 'dist', 'RequiredVersions.js'));
          for (const [name, minimum] of Object.entries(REQUIRED_VERSIONS)) {
            const found = cp.spawnSync('pkg-config', ['--modversion', name], { encoding: 'utf8' });
            const have = found.status === 0 ? found.stdout.trim() : 'none';
            const ok = cp.spawnSync('pkg-config', [`--atleast-version=${minimum}`, name]).status === 0;
            if (!ok) {
              fail(`${name} >= ${minimum} is required, found ${have}`);
            }
            console.log(`${name} ${have} satisfies >= ${minimum}`);
          }
          if (!fs.existsSync(component)) {
            fail(`the native component was not built: ${component}`);
          }
          require(component);
          console.log('Native component loads');
          console.log(`the-seed ${installed} checked`);
          NODE

      - name: Install packages
        id: prepare
        run: |
          npm ci
          if grep -nE '"file:|^\s*"\.\./' package-lock.json; then
            echo "::error::package-lock.json must not contain a file: or ../ dependency"
            exit 1
          fi

      - name: Restore editor
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ env.VSCODE_VERSION }}

      - name: Check the editor version
        run: |
          if ! grep -q "version: '$VSCODE_VERSION'" .vscode-test.mjs; then
            echo "::error::.vscode-test.mjs does not name editor version $VSCODE_VERSION"
            exit 1
          fi
          engines="$(node -p "require('./package.json').engines.vscode")"
          if [ "$engines" != "^$VSCODE_VERSION" ]; then
            echo "::error::package.json engines.vscode is $engines, expected ^$VSCODE_VERSION"
            exit 1
          fi

      - name: Compile
        id: compile
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run compile

      - name: Type check sidebar
        id: typecheck
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run typecheck

      - name: Style check
        id: lint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run lint

      - name: Bundle
        id: bundle
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npm run bundle

      - name: Host suite
        id: host
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.compile.outcome == 'success' && steps.bundle.outcome == 'success' }}
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          case "$REPEAT" in
            ''|*[!0-9]*|0|0[0-9]*)
              echo "::error::repeat must be a positive integer, got '$REPEAT'"
              exit 1
              ;;
          esac
          mkdir -p test-results
          export THE_SEED_TEST_TOOL="$(npm root -g)/@metaverse-systems/the-seed"
          npm test -- host -- --repeat "$REPEAT" 2>&1 | tee test-results/host.log

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          mkdir -p test-results
          npm run package 2>&1 | tee test-results/package.log

      # The package's SHA-256 and each file's, so that a package downloaded
      # later can be checked byte for byte against this build.
      - name: Package digest
        id: digest
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          shopt -s nullglob
          packages=(the-seed-vscode-*.vsix)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected one package, found ${#packages[@]}"
            exit 1
          fi
          vsix="${packages[0]}"
          mkdir -p test-results
          {
            echo "# Package"
            sha256sum "$vsix"
            echo
            echo "# Files"
            unzip -Z1 "$vsix" | LC_ALL=C sort | while IFS= read -r entry; do
              case "$entry" in */) continue ;; esac
              # unzip reads its member argument as a wildcard; brackets, * and ? are matched literally.
              pattern="$(printf '%s' "$entry" | sed -e 's/\[/[[]/g' -e 's/\*/[*]/g' -e 's/?/[?]/g')"
              printf '%s  %s\n' "$(unzip -p "$vsix" "$pattern" | sha256sum | cut -d' ' -f1)" "$entry"
            done
          } > test-results/package-digest.txt
          {
            echo "## Package digest"
            echo
            echo '```text'
            cat test-results/package-digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        if: ${{ !cancelled() && steps.package.outcome == 'success' && steps.digest.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: the-seed-vscode-vsix
          path: |
            the-seed-vscode-*.vsix
            test-results/package-digest.txt
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          {
            echo "## Check results (${{ matrix.os }})"
            echo
            echo "| Stage | Outcome |"
            echo "|---|---|"
            echo "| Compile | ${COMPILE_OUTCOME:-skipped} |"
            echo "| Type check sidebar | ${TYPECHECK_OUTCOME:-skipped} |"
            echo "| Style check | ${LINT_OUTCOME:-skipped} |"
            echo "| Bundle | ${BUNDLE_OUTCOME:-skipped} |"
            echo "| Host suite | ${HOST_OUTCOME:-skipped} |"
            echo "| Package | ${PACKAGE_OUTCOME:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/package.log ]; then
            { grep -E '^(PACKAGE [A-Z]+|BUNDLE [A-Z]+):' test-results/package.log || true; } | while IFS= read -r line; do
              echo "::error::$line"
              echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            done
            { grep -E '^Package:' test-results/package.log || true; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f test-results/host.log ]; then
            { grep -E '^(FAILED|SILENT SKIP|PLATFORM SKIP ON LINUX|LEFTOVER|REAL HOME CHANGED|RESULTS MISSING|MALFORMED KNOWN GAP|STALE KNOWN GAP):' test-results/host.log || true; } | while IFS= read -r line; do
              echo "::error::$line"
            done
            { grep -E '^(KNOWN GAP|PLATFORM SKIP):' test-results/host.log || true; } | while IFS= read -r line; do
              echo "::notice::$line"
            done
            { grep -E '^Totals:' test-results/host.log || true; } | while IFS= read -r line; do
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$line"
            done
          else
            echo "No host log; test summary skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/
            .vscode-test/user-data/logs/
          if-no-files-found: ignore

  # The extension is used on Windows with the extension host in WSL, so the
  # Windows side is checked the same way: a hosted Windows runner with an
  # Ubuntu distribution, and the same checks as above run inside it.
  check-wsl:
    name: check (windows-2025, WSL Ubuntu-24.04)
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: wsl-bash -u runner {0}
    env:
      NODE_MAJOR: "22" # same as the Linux job
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "Tag $REF_NAME matches package.json version $version"

      - name: Set up WSL
        timeout-minutes: 10
        uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04

      - name: Validate repeat
        id: repeat
        shell: bash
        env:
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          case "$REPEAT" in
            ''|*[!0-9]*|0|0[0-9]*)
              echo "::error::repeat must be a positive integer, got '$REPEAT'"
              exit 1
              ;;
          esac
          echo "value=$REPEAT" >> "$GITHUB_OUTPUT"

      - name: Check the editor version
        shell: bash
        run: |
          if ! grep -q "version: '$VSCODE_VERSION'" .vscode-test.mjs; then
            echo "::error::.vscode-test.mjs does not name editor version $VSCODE_VERSION"
            exit 1
          fi
          engines="$(node -p "require('./package.json').engines.vscode")"
          if [ "$engines" != "^$VSCODE_VERSION" ]; then
            echo "::error::package.json engines.vscode is $engines, expected ^$VSCODE_VERSION"
            exit 1
          fi

      - name: Install tools
        shell: wsl-bash -u root {0}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo curl ca-certificates git xz-utils xvfb xauth build-essential autoconf automake libtool pkg-config \
            python3 openssl osslsigncode g++-mingw-w64-x86-64 wixl libxml2-utils \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libnss3 libsecret-1-0 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxkbfile1 libxrandr2 libxss1
          # A normal user runs everything else, as on the Linux runner; the
          # editor will not start as root.
          # The POSIX threads flavour of the cross compiler, which libthe-seed needs.
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          id runner >/dev/null 2>&1 || useradd --create-home --shell /bin/bash runner
          echo 'runner ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/runner
          chmod 0440 /etc/sudoers.d/runner
          # Node, from the official release, owned by the user so that
          # global installs need no privileges.
          cd "$(mktemp -d)"
          base="https://nodejs.org/dist/latest-v${{ env.NODE_MAJOR }}.x"
          curl -fsSL "$base/SHASUMS256.txt" -o SHASUMS256.txt
          archive="$(grep -oE "node-v[0-9.]+-linux-x64\.tar\.xz" SHASUMS256.txt | head -n 1)"
          curl -fsSL "$base/$archive" -o "$archive"
          grep " $archive\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p /opt/node
          tar -xJf "$archive" -C /opt/node --strip-components=1
          chown -R runner:runner /opt/node
          for bin in node npm npx; do ln -sf "/opt/node/bin/$bin" "/usr/local/bin/$bin"; done
          node --version
          npm --version
          xvfb-run --help > /dev/null
          pkg-config --version
          python3 --version
          openssl version
          osslsigncode --version
          x86_64-w64-mingw32-g++ --version
          wixl --version

      - name: Copy the checkout into WSL
        run: |
          src="$(wslpath -u "$(powershell.exe -NoProfile -Command '$env:GITHUB_WORKSPACE' | tr -d '\r')")"
          mkdir -p "$HOME/work"
          rm -rf "$HOME/work/the-seed-vscode"
          cp -a "$src" "$HOME/work/the-seed-vscode"
          rm -rf "$HOME/work/the-seed-vscode/.git"
          cd "$HOME/work/the-seed-vscode"
          ls

      - name: Build libecs-cpp
        run: |
          mkdir -p "$HOME/build/libecs-cpp"
          cd "$HOME/build/libecs-cpp"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libecs-cpp.git "${{ env.LIBECS_CPP_REF }}"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --prefix="$HOME/deps" --enable-tests=no
          make -j4
          make install

      - name: Build libthe-seed
        run: |
          export PKG_CONFIG_PATH="$HOME/deps/lib/pkgconfig"
          mkdir -p "$HOME/build/libthe-seed"
          cd "$HOME/build/libthe-seed"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libthe-seed.git "${{ env.LIBTHE_SEED_REF }}"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --prefix="$HOME/deps" --enable-tests=no
          make -j4
          make install

      - name: Build libecs-cpp for Windows
        run: |
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$HOME/deps/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          mkdir -p "$HOME/build/libecs-cpp-windows"
          cd "$HOME/build/libecs-cpp-windows"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libecs-cpp.git "${{ env.LIBECS_CPP_REF }}"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix="$HOME/deps/x86_64-w64-mingw32" --enable-tests=no
          make -j4
          make install

      - name: Build libthe-seed for Windows
        run: |
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$HOME/deps/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          mkdir -p "$HOME/build/libthe-seed-windows"
          cd "$HOME/build/libthe-seed-windows"
          git init
          git fetch --depth 1 https://github.com/metaverse-systems/libthe-seed.git "${{ env.LIBTHE_SEED_REF }}"
          git checkout FETCH_HEAD
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix="$HOME/deps/x86_64-w64-mingw32" --enable-tests=no
          make -j4
          make install

      - name: Use libraries
        run: |
          {
            echo "export PKG_CONFIG_PATH=\"$HOME/deps/lib/pkgconfig\""
            echo "export LD_LIBRARY_PATH=\"$HOME/deps/lib\""
            echo "export THE_SEED_TEST_DEPS=\"$HOME/deps\""
            echo 'export THE_SEED_TEST_TOOL="$(npm root -g)/@metaverse-systems/the-seed"'
          } > "$HOME/ci-env.sh"

      - name: Check the Windows toolchain and libraries
        run: |
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-g++ -v 2>&1 | grep 'Thread model: posix'
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$HOME/deps/x86_64-w64-mingw32/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          pkg-config --modversion ecs-cpp the-seed
          ls "$HOME/deps/x86_64-w64-mingw32/bin"

      - name: Install the tool
        run: |
          . "$HOME/ci-env.sh"
          npm install -g "@metaverse-systems/the-seed@${{ env.THE_SEED_VERSION }}" --foreground-scripts

      - name: Check the tool
        run: |
          . "$HOME/ci-env.sh"
          cd "$HOME/work/the-seed-vscode"
          THE_SEED_VERSION="${{ env.THE_SEED_VERSION }}" node - "$(npm root -g)/@metaverse-systems/the-seed" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const root = process.argv[2];
          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          const installed = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8')).version;
          const expected = process.env.THE_SEED_VERSION;
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const declared = manifest.devDependencies && manifest.devDependencies['@metaverse-systems/the-seed'];
          if (installed !== expected) {
            fail(`the tool is ${installed}, expected ${expected}`);
          }
          if (declared !== expected) {
            fail(`package.json declares the tool as ${declared}, expected ${expected}`);
          }
          const component = path.join(root, 'native', 'build', 'Release', 'the_seed_native.node');
          const { REQUIRED_VERSIONS } = require(path.join(root, 'dist', 'RequiredVersions.js'));
          for (const [name, minimum] of Object.entries(REQUIRED_VERSIONS)) {
            const found = cp.spawnSync('pkg-config', ['--modversion', name], { encoding: 'utf8' });
            const have = found.status === 0 ? found.stdout.trim() : 'none';
            const ok = cp.spawnSync('pkg-config', [`--atleast-version=${minimum}`, name]).status === 0;
            if (!ok) {
              fail(`${name} >= ${minimum} is required, found ${have}`);
            }
            console.log(`${name} ${have} satisfies >= ${minimum}`);
          }
          if (!fs.existsSync(component)) {
            fail(`the native component was not built: ${component}`);
          }
          require(component);
          console.log('Native component loads');
          console.log(`the-seed ${installed} checked`);
          NODE

      - name: Install packages
        id: prepare
        run: |
          . "$HOME/ci-env.sh"
          cd "$HOME/work/the-seed-vscode"
          npm ci
          if grep -nE '"file:|^\s*"\.\./' package-lock.json; then
            echo "::error::package-lock.json must not contain a file: or ../ dependency"
            exit 1
          fi

      - name: Compile
        id: compile
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          cd "$HOME/work/the-seed-vscode"
          npm run compile

      - name: Type check sidebar
        id: typecheck
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          cd "$HOME/work/the-seed-vscode"
          npm run typecheck

      - name: Style check
        id: lint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          cd "$HOME/work/the-seed-vscode"
          npm run lint

      - name: Bundle
        id: bundle
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          cd "$HOME/work/the-seed-vscode"
          npm run bundle

      - name: Host suite
        id: host
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.compile.outcome == 'success' && steps.bundle.outcome == 'success' }}
        run: |
          . "$HOME/ci-env.sh"
          cd "$HOME/work/the-seed-vscode"
          mkdir -p test-results
          npm test -- host -- --repeat "${{ steps.repeat.outputs.value }}" 2>&1 | tee test-results/host.log

      - name: Copy results back
        if: always()
        run: |
          src="$(wslpath -u "$(powershell.exe -NoProfile -Command '$env:GITHUB_WORKSPACE' | tr -d '\r')")"
          from="$HOME/work/the-seed-vscode"
          if [ -d "$from/test-results" ]; then
            mkdir -p "$src/test-results"
            cp -R "$from/test-results/." "$src/test-results/"
          fi
          if [ -d "$from/.vscode-test/user-data/logs" ]; then
            mkdir -p "$src/.vscode-test/user-data/logs"
            cp -R "$from/.vscode-test/user-data/logs/." "$src/.vscode-test/user-data/logs/"
          fi

      - name: Summary
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
        run: |
          {
            echo "## Check results (windows-2025, WSL Ubuntu-24.04)"
            echo
            echo "| Stage | Outcome |"
            echo "|---|---|"
            echo "| Compile | ${COMPILE_OUTCOME:-skipped} |"
            echo "| Type check sidebar | ${TYPECHECK_OUTCOME:-skipped} |"
            echo "| Style check | ${LINT_OUTCOME:-skipped} |"
            echo "| Bundle | ${BUNDLE_OUTCOME:-skipped} |"
            echo "| Host suite | ${HOST_OUTCOME:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/host.log ]; then
            { grep -E '^(FAILED|SILENT SKIP|PLATFORM SKIP ON LINUX|LEFTOVER|REAL HOME CHANGED|RESULTS MISSING|MALFORMED KNOWN GAP|STALE KNOWN GAP):' test-results/host.log || true; } | while IFS= read -r line; do
              echo "::error::$line"
            done
            { grep -E '^(KNOWN GAP|PLATFORM SKIP):' test-results/host.log || true; } | while IFS= read -r line; do
              echo "::notice::$line"
            done
            { grep -E '^Totals:' test-results/host.log || true; } | while IFS= read -r line; do
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$line"
            done
          else
            echo "No host log; test summary skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-2025-wsl
          path: |
            test-results/
            .vscode-test/user-data/logs/
          if-no-files-found: ignore

  # The package built above, installed on clean machines the way the readme
  # says: the system packages, then the tool from the registry, then the
  # package into a fresh editor profile with a fresh home, and no library
  # cache. Each leg writes one record per command (scripts/clean-install). It
  # runs on version tags and on dispatch only, not on pull requests or pushes
  # to main.
  clean-install:
    name: clean-install (${{ matrix.leg }})
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux
            os: ubuntu-24.04
          - leg: windows-wsl
            os: windows-2025
          - leg: windows-no-wsl
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NODE_MAJOR: "22" # same as the check jobs
    steps:
      - name: Keep line endings as committed
        if: matrix.os == 'windows-2025'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download package
        if: matrix.leg != 'windows-no-wsl'
        uses: actions/download-artifact@v8
        with:
          name: the-seed-vscode-vsix
          path: package

      # Linux: an Ubuntu runner.

      - name: Set up Node (Linux)
        if: matrix.leg == 'linux'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: npm

      - name: Install system packages (Linux)
        if: matrix.leg == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool pkg-config autoconf automake curl git python3 \
            mingw-w64-x86-64-dev g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wixl xvfb xauth
          # The POSIX threads flavour of the cross compiler, which libthe-seed needs.
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          if [ -e "$HOME/the-seed" ]; then
            echo "::error::$HOME/the-seed exists on a fresh runner"
            exit 1
          fi

      - name: Install the tool (Linux)
        if: matrix.leg == 'linux'
        shell: bash
        run: npm install -g --foreground-scripts "@metaverse-systems/the-seed@$THE_SEED_VERSION"

      - name: Install the check's packages (Linux)
        if: matrix.leg == 'linux'
        shell: bash
        run: npm ci --ignore-scripts

      - name: Clean-install check (Linux)
        if: matrix.leg == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          packages=(package/the-seed-vscode-*.vsix)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected one package, found ${#packages[@]}"
            exit 1
          fi
          xvfb-run -a node scripts/clean-install/run.js --leg linux --vsix "${packages[0]}"

      # Windows with WSL: the extension host and the tool in Ubuntu, as on Linux.

      # The same action, version and inputs as the check job's WSL; the setup is bounded so a hang
      # fails in minutes, and it is tried a second time because a hung first attempt is a runner fault.
      - name: Set up WSL
        id: wsl
        if: matrix.leg == 'windows-wsl'
        continue-on-error: true
        timeout-minutes: 10
        uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04

      - name: Set up WSL (second attempt)
        if: matrix.leg == 'windows-wsl' && steps.wsl.outcome != 'success'
        timeout-minutes: 10
        uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04

      - name: Install system packages (WSL)
        if: matrix.leg == 'windows-wsl'
        shell: wsl-bash -u root {0}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo curl ca-certificates git xz-utils build-essential libtool pkg-config autoconf automake python3 \
            mingw-w64-x86-64-dev g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wixl xvfb xauth \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libnss3 libsecret-1-0 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxkbfile1 libxrandr2 libxss1
          # The POSIX threads flavour of the cross compiler, which libthe-seed needs.
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          # A normal user runs everything else; the editor will not start as root.
          id runner >/dev/null 2>&1 || useradd --create-home --shell /bin/bash runner
          echo 'runner ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/runner
          chmod 0440 /etc/sudoers.d/runner
          if [ -e /home/runner/the-seed ]; then
            echo "::error::/home/runner/the-seed exists on a fresh distribution"
            exit 1
          fi
          # Node, from the official release, owned by the user so that
          # global installs need no privileges.
          cd "$(mktemp -d)"
          base="https://nodejs.org/dist/latest-v${{ env.NODE_MAJOR }}.x"
          curl -fsSL "$base/SHASUMS256.txt" -o SHASUMS256.txt
          archive="$(grep -oE "node-v[0-9.]+-linux-x64\.tar\.xz" SHASUMS256.txt | head -n 1)"
          curl -fsSL "$base/$archive" -o "$archive"
          grep " $archive\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p /opt/node
          tar -xJf "$archive" -C /opt/node --strip-components=1
          chown -R runner:runner /opt/node
          for bin in node npm npx; do ln -sf "/opt/node/bin/$bin" "/usr/local/bin/$bin"; done
          node --version

      - name: Copy the checkout into WSL
        if: matrix.leg == 'windows-wsl'
        shell: wsl-bash -u runner {0}
        run: |
          src="$(wslpath -u "$(powershell.exe -NoProfile -Command '$env:GITHUB_WORKSPACE' | tr -d '\r')")"
          mkdir -p "$HOME/work"
          rm -rf "$HOME/work/the-seed-vscode"
          cp -a "$src" "$HOME/work/the-seed-vscode"
          rm -rf "$HOME/work/the-seed-vscode/.git"
          ls "$HOME/work/the-seed-vscode/package"

      - name: Install the tool (WSL)
        if: matrix.leg == 'windows-wsl'
        shell: wsl-bash -u runner {0}
        run: npm install -g --foreground-scripts "@metaverse-systems/the-seed@${{ env.THE_SEED_VERSION }}"

      - name: Install the check's packages (WSL)
        if: matrix.leg == 'windows-wsl'
        shell: wsl-bash -u runner {0}
        run: |
          cd "$HOME/work/the-seed-vscode"
          npm ci --ignore-scripts

      - name: Clean-install check (WSL)
        if: matrix.leg == 'windows-wsl'
        shell: wsl-bash -u runner {0}
        run: |
          cd "$HOME/work/the-seed-vscode"
          shopt -s nullglob
          packages=(package/the-seed-vscode-*.vsix)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::expected one package, found ${#packages[@]}"
            exit 1
          fi
          GITHUB_ACTIONS=true GITHUB_RUN_ID="${{ github.run_id }}" VSCODE_VERSION="${{ env.VSCODE_VERSION }}" \
            xvfb-run -a node scripts/clean-install/run.js --leg windows-wsl --vsix "${packages[0]}"

      - name: Copy results back (WSL)
        if: always() && matrix.leg == 'windows-wsl'
        shell: wsl-bash -u runner {0}
        run: |
          src="$(wslpath -u "$(powershell.exe -NoProfile -Command '$env:GITHUB_WORKSPACE' | tr -d '\r')")"
          from="$HOME/work/the-seed-vscode"
          if [ -d "$from/test-results" ]; then
            mkdir -p "$src/test-results"
            cp -R "$from/test-results/." "$src/test-results/"
          fi

      # Windows without WSL: Windows Node and the tool without its native
      # component; no editor (the readme lists what is unavailable there).

      - name: Set up Node (Windows)
        if: matrix.leg == 'windows-no-wsl'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_MAJOR }}

      - name: Use a fresh home (Windows)
        if: matrix.leg == 'windows-no-wsl'
        shell: pwsh
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'clean-install-home'
          New-Item -ItemType Directory -Force -Path $fresh | Out-Null
          if ((Get-ChildItem -Force -Path $fresh | Measure-Object).Count -ne 0) {
            Write-Output "::error::$fresh is not empty"
            exit 1
          }
          "HOME=$fresh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "USERPROFILE=$fresh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install the tool (Windows)
        if: matrix.leg == 'windows-no-wsl'
        shell: pwsh
        run: npm install -g --foreground-scripts "@metaverse-systems/the-seed@$env:THE_SEED_VERSION"

      - name: Clean-install check (Windows)
        if: matrix.leg == 'windows-no-wsl'
        shell: pwsh
        run: node scripts/clean-install/no-wsl.js

      - name: Summary
        if: always()
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
        run: |
          file="test-results/clean-install-$LEG.json"
          {
            echo "## Clean-install check ($LEG)"
            echo
            if [ -f "$file" ]; then
              node -e '
                const records = require(require("path").resolve(process.argv[1]));
                const counts = {};
                for (const record of records) {
                  const kind = record.outcome.replace(/ \(.*$|:.*$/, "");
                  counts[kind] = (counts[kind] || 0) + 1;
                }
                console.log("| Outcome | Commands |");
                console.log("|---|---|");
                for (const [kind, count] of Object.entries(counts)) console.log(`| ${kind} | ${count} |`);
                console.log();
                console.log("| Command | Outcome |");
                console.log("|---|---|");
                for (const record of records) console.log(`| ${record.command} | ${record.outcome.replace(/\|/g, "\\|")} |`);
              ' "$file"
            else
              echo "No records were written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-install-${{ matrix.leg }}
          path: test-results/clean-install-*.json
          if-no-files-found: warn
